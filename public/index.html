<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho Image Optimizer V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f97316;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

<div class="max-w-6xl mx-auto px-4 py-10">
    <header class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-2">Listing Image Optimizer</h1>
        <p class="text-lg text-gray-600 max-w-2xl mx-auto">Generate 50 color variations for Border Tricks or Full Backgrounds.</p>
    </header>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-10 max-w-2xl mx-auto">
        <!-- 1. Upload & Preview -->
        <div class="flex flex-col items-center justify-center w-full mb-6">
            <label for="imageUpload" class="flex flex-col items-center justify-center w-full h-64 border-2 border-orange-300 border-dashed rounded-lg cursor-pointer bg-orange-50 hover:bg-orange-100 transition duration-200 relative overflow-hidden">
                <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-contain p-4 z-10 bg-white" />
                <div id="uploadPlaceholder" class="flex flex-col items-center justify-center pt-5 pb-6 z-0">
                    <svg class="w-12 h-12 mb-3 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="mb-2 text-lg text-gray-700"><span class="font-semibold text-orange-600">Click to upload</span></p>
                </div>
                <input id="imageUpload" type="file" class="hidden" accept="image/png, image/jpeg" />
            </label>
        </div>

        <!-- 2. Mode Selector -->
        <div class="mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
            <label class="font-semibold text-gray-700 block mb-3">Generation Mode</label>
            <div class="flex gap-6">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="imageMode" value="border" checked class="w-5 h-5 text-orange-600 accent-orange-600">
                    <span class="font-medium text-gray-800">Border Trick (Shrink Product)</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="imageMode" value="full" class="w-5 h-5 text-orange-600 accent-orange-600">
                    <span class="font-medium text-gray-800">Full Background (Normal Size)</span>
                </label>
            </div>
        </div>

        <!-- 3. Border Size Slider -->
        <div id="sliderContainer" class="mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200 transition-opacity duration-200">
            <div class="flex justify-between items-center mb-2">
                <label for="scaleSlider" class="font-semibold text-gray-700">Product Size (Border Thickness)</label>
                <span id="scaleValue" class="text-orange-600 font-bold bg-orange-100 px-2 py-1 rounded">50%</span>
            </div>
            <input type="range" id="scaleSlider" min="0.1" max="0.9" step="0.05" value="0.5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-orange-600">
            <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>Tiny Product (Huge Border)</span>
                <span>Large Product (Small Border)</span>
            </div>
        </div>
        
        <button id="generateBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed text-lg">
            Generate 50 Variations
        </button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="hidden flex-col items-center justify-center mb-10">
        <div class="loader mb-4"></div>
        <p class="text-gray-600 font-medium mt-3">Processing 50 images... This takes a few seconds.</p>
    </div>

    <!-- Gallery Section -->
    <div id="resultsSection" class="hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Generated Variations (50)</h2>
            <button id="downloadAllBtn" class="bg-gray-900 hover:bg-black text-white font-semibold py-2 px-5 rounded-md shadow-sm transition duration-200 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download All as ZIP
            </button>
        </div>
        
        <!-- Grid optimized for 50 images -->
        <div id="gallery" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-8 gap-4"></div>
    </div>
</div>

<script>
    const imageUpload = document.getElementById('imageUpload');
    const imagePreview = document.getElementById('imagePreview');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const modeRadios = document.getElementsByName('imageMode');
    const sliderContainer = document.getElementById('sliderContainer');
    const scaleSlider = document.getElementById('scaleSlider');
    const scaleValue = document.getElementById('scaleValue');
    const generateBtn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const resultsSection = document.getElementById('resultsSection');
    const gallery = document.getElementById('gallery');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    let generatedData = [];

    // Preview Image
    imageUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            imagePreview.src = URL.createObjectURL(file);
            imagePreview.classList.remove('hidden');
            uploadPlaceholder.classList.add('opacity-0'); 
        }
    });

    // Toggle Slider when Full Background is selected
    modeRadios.forEach(radio => {
        radio.addEventListener('change', (e) => {
            if (e.target.value === 'full') {
                sliderContainer.classList.add('opacity-40', 'pointer-events-none');
            } else {
                sliderContainer.classList.remove('opacity-40', 'pointer-events-none');
            }
        });
    });

    // Update Slider Text
    scaleSlider.addEventListener('input', (e) => {
        scaleValue.textContent = Math.round(e.target.value * 100) + '%';
    });

    // Generate Images
    generateBtn.addEventListener('click', async () => {
        if (!imageUpload.files[0]) return alert('Please upload an image first.');

        resultsSection.classList.add('hidden');
        gallery.innerHTML = '';
        loading.classList.remove('hidden');
        generateBtn.disabled = true;

        const formData = new FormData();
        formData.append('image', imageUpload.files[0]);
        formData.append('scale', scaleSlider.value); 
        formData.append('mode', document.querySelector('input[name="imageMode"]:checked').value);

        try {
            const response = await fetch('/api/generate', { method: 'POST', body: formData });
            const data = await response.json();

            if (data.success) {
                generatedData = data.images;
                displayImages(generatedData);
                resultsSection.classList.remove('hidden');
            } else {
                alert(data.error || 'Failed to generate images.');
            }
        } catch (err) {
            console.error(err);
            alert('Server error occurred.');
        } finally {
            loading.classList.add('hidden');
            generateBtn.disabled = false;
        }
    });

    function displayImages(images) {
        images.forEach((img) => {
            const card = document.createElement('div');
            card.className = 'bg-white p-2 rounded-lg shadow-sm border border-gray-100 flex flex-col items-center hover:shadow-md transition';
            card.innerHTML = `
                <div class="w-full bg-gray-100 rounded overflow-hidden border border-gray-200">
                    <img src="${img.url}" class="w-full aspect-square object-contain">
                </div>
            `;
            gallery.appendChild(card);
        });
    }

    // ZIP Download
    downloadAllBtn.addEventListener('click', async () => {
        if (generatedData.length === 0) return;
        
        const zip = new JSZip();
        
        generatedData.forEach((img) => {
            const base64Data = img.url.split(',')[1];
            zip.file(img.filename, base64Data, {base64: true});
        });

        downloadAllBtn.textContent = "Zipping 50 Files...";
        const content = await zip.generateAsync({type: "blob"});
        
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = "Meesho_Optimized_Images.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        downloadAllBtn.innerHTML = '<svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Download All as ZIP';
    });
</script>
</body>
</html>
