<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho Image Optimizer Dashboard</title>
    <!-- Use Tailwind CSS for a modern, beautiful UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f97316;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

<div class="max-w-6xl mx-auto px-4 py-10">
    <!-- Header -->
    <header class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-2">Listing Image Optimizer</h1>
        <p class="text-lg text-gray-600 max-w-2xl mx-auto">Bulk generate 1500x1500px catalog images with modified bounding boxes to optimize AI shipping tier estimations.</p>
    </header>

    <!-- Upload Section -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-10 max-w-2xl mx-auto">
        <div class="flex flex-col items-center justify-center w-full">
            <label for="imageUpload" class="flex flex-col items-center justify-center w-full h-64 border-2 border-orange-300 border-dashed rounded-lg cursor-pointer bg-orange-50 hover:bg-orange-100 transition duration-200">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <svg class="w-12 h-12 mb-3 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="mb-2 text-lg text-gray-700"><span class="font-semibold text-orange-600">Click to upload</span> or drag and drop</p>
                    <p class="text-sm text-gray-500">PNG or JPG (Best results with white background)</p>
                </div>
                <input id="imageUpload" type="file" class="hidden" accept="image/png, image/jpeg" />
            </label>
            <p id="fileName" class="mt-3 text-sm font-medium text-gray-700 hidden">Selected File: <span id="nameText" class="text-orange-600"></span></p>
        </div>
        
        <button id="generateBtn" class="mt-6 w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed text-lg">
            Generate 10 Variations
        </button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="hidden flex-col items-center justify-center mb-10">
        <div class="loader mb-4"></div>
        <p class="text-gray-600 font-medium">Processing images locally... Please wait.</p>
    </div>

    <!-- Gallery Section -->
    <div id="resultsSection" class="hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Generated Variations</h2>
            <button id="downloadAllBtn" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2 px-5 rounded-md shadow-sm transition duration-200">
                Download All Images
            </button>
        </div>
        
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Images will be injected here via JavaScript -->
        </div>
    </div>
</div>

<script>
    const imageUpload = document.getElementById('imageUpload');
    const fileNameDisplay = document.getElementById('fileName');
    const nameText = document.getElementById('nameText');
    const generateBtn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const resultsSection = document.getElementById('resultsSection');
    const gallery = document.getElementById('gallery');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    let generatedData = [];

    // Show filename when a file is selected
    imageUpload.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            fileNameDisplay.classList.remove('hidden');
            nameText.textContent = e.target.files[0].name;
        } else {
            fileNameDisplay.classList.add('hidden');
        }
    });

    // Handle Generation
    generateBtn.addEventListener('click', async () => {
        if (!imageUpload.files[0]) {
            alert('Please upload an image first.');
            return;
        }

        // Reset UI State
        resultsSection.classList.add('hidden');
        gallery.innerHTML = '';
        loading.classList.remove('hidden');
        generateBtn.disabled = true;

        const formData = new FormData();
        formData.append('image', imageUpload.files[0]);

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                generatedData = data.images;
                displayImages(generatedData);
                resultsSection.classList.remove('hidden');
            } else {
                alert(data.error || 'Failed to generate images.');
            }
        } catch (err) {
            console.error(err);
            alert('Server error occurred. Make sure your backend is running.');
        } finally {
            loading.classList.add('hidden');
            generateBtn.disabled = false;
        }
    });

    // Render images to DOM
    function displayImages(images) {
        images.forEach((img) => {
            const card = document.createElement('div');
            card.className = 'bg-white p-3 rounded-xl shadow-md border border-gray-100 flex flex-col items-center hover:shadow-lg transition duration-200';
            
            card.innerHTML = `
                <div class="w-full bg-gray-100 rounded-lg overflow-hidden mb-3 border border-gray-200">
                    <img src="${img.url}" alt="Variation" class="w-full aspect-square object-contain">
                </div>
                <a href="${img.url}" download="${img.filename}" class="w-full text-center bg-orange-100 hover:bg-orange-200 text-orange-800 font-semibold py-2 px-4 rounded transition duration-200 block text-sm">
                    Download JPG
                </a>
            `;
            gallery.appendChild(card);
        });
    }

    // Download All logic
    downloadAllBtn.addEventListener('click', () => {
        if (generatedData.length === 0) return;
        
        let index = 0;
        // Download files with a 300ms delay to prevent browser pop-up blockers from stopping it
        const interval = setInterval(() => {
            if (index >= generatedData.length) {
                clearInterval(interval);
                return;
            }
            const a = document.createElement('a');
            a.href = generatedData[index].url;
            a.download = generatedData[index].filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            index++;
        }, 300);
    });
</script>
</body>
</html>
